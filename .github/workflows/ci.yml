name: UCF RWC Full-Stack CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-tests:
    name: Django Backend, ORM & PostgreSQL Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ucf_rwc_db
          POSTGRES_USER: ucf_rwc_user
          POSTGRES_PASSWORD: ucf_rwc_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Migrations & Automated Unit Tests
        working-directory: ./backend
        env:
          DB_NAME: ucf_rwc_db
          DB_USER: ucf_rwc_user
          DB_PASSWORD: ucf_rwc_password
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: ci-test-secret-key-ucf-rwc
          DJANGO_DEBUG: "True"
        run: |
          if [ -f manage.py ]; then
            python manage.py makemigrations --check --dry-run
            python manage.py migrate
            python manage.py test --verbosity=2
          fi

  frontend-build:
    name: Next.js TypeScript & Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and Build (with TypeScript verification)
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm run build
          fi
