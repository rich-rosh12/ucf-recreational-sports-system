services:
  db:
    image: postgres:16-alpine
    container_name: ucf_rwc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucf_rwc_db
      POSTGRES_USER: ucf_rwc_user
      POSTGRES_PASSWORD: ucf_rwc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucf_rwc_user -d ucf_rwc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: